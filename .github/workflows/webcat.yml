name: WEBCAT

# A workflow of its own: the enrollment trusts this file's identity, which signs nothing but WEBCAT manifests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The CLI's build tooling never sees the OIDC token.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: freedomofpress/webcat-cli
          # Unreleased: npm 0.1.3 predates manifests for 3.2.0 extensions and Rekor v2 signing.
          ref: 211c6fc686eb2b04e927d43f77b56379901775ac
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webcat-cli
          path: dist/cli.cjs
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webcat-cli
          path: ${{ runner.temp }}/webcat-cli
      - run: |
          webcat() { node "$RUNNER_TEMP/webcat-cli/cli.cjs" "$@"; }
          hex() { printf '%s=' "$1" | tr '_-' '/+' | base64 -d | od -An -tx1 | tr -d ' \n'; }
          # Browsers request the plain paths; Apache serves the .br files in their place.
          rsync -a --exclude '*.br' dist/ site/
          # Extensions refetch the manifest once per version, so every signature gets a new one.
          jq --arg v "0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" '.version = $v' webcat.config.json >"$RUNNER_TEMP/config.json"
          webcat manifest generate --type sigstore -c "$RUNNER_TEMP/config.json" -d site --exclude _headers -o "$RUNNER_TEMP/manifest.json"
          webcat manifest sign --type sigstore -i "$RUNNER_TEMP/manifest.json" -o "$RUNNER_TEMP/signed.json"
          out=site/.well-known/webcat
          mkdir -p "$out"
          enrollment=.well-known/webcat/enrollment.json
          cp "$enrollment" "$out/enrollment.json"
          cp "$enrollment" "$out/enrollment.$(hex "$(webcat enrollment hash -i "$enrollment")").json"
          cp "$RUNNER_TEMP/signed.json" "$out/manifest.sigstore.$(hex "$(webcat manifest hash -i "$RUNNER_TEMP/signed.json")").json"
          webcat bundle create -e "$enrollment" -m "$RUNNER_TEMP/signed.json" -o "$out/bundle.json"
          webcat manifest verify "$out/bundle.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webcat
          path: site/.well-known/webcat/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
