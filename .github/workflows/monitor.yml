name: Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same URL as the production environment in ci.yml.
      - run: scripts/verify-deployment.sh https://masque.onestla.tech "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
